    <meta
      id="dynamic-viewport-meta"
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="SwiftStack (SS) — Next-Gen Digital Engineering, AI Automation & Pure Sheesha Glass Shopping Platform founded by Muhammad Sarib Randhawa."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('swiftstack_theme_mode_v5');
          if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
          }
          var mode =
            localStorage.getItem('swiftstack_view_mode_v6') ||
            localStorage.getItem('swiftstack_view_mode_v5');
          if (mode === 'desktop' || mode === 'mobile') {
            document.documentElement.setAttribute('data-view-mode', mode);
            var meta = document.getElementById('dynamic-viewport-meta');
            var sw = window.screen && window.screen.width ? window.screen.width : window.innerWidth;
            if (meta && mode === 'desktop' && sw > 0 && sw < 1024) {
              var s = Math.max(0.24, Math.min(1, Number((sw / 1280).toFixed(4))));
              meta.setAttribute(
                'content',
                'width=1280, initial-scale=' +
                  s +
                  ', minimum-scale=' +
                  s +
                  ', maximum-scale=3.0, user-scalable=yes'
              );
            }
          }
        } catch (e) {}
      })();
    </script>
